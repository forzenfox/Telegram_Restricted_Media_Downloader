[project]
name = "Telegram_Restricted_Media_Downloader"
authors = [{name = "Gentlesprite", email = "Gentlesprites@outlook.com"}]
version = "2.0.0"
description = "Telegram downloader (TRMD): Supports resumable downloads and uploads. Bot supports commands/links for downloading, forwarding, listening, uploading, and upload-after-download of non-downloadable Telegram content via API."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "kurigram==2.2.19",
    "pygments>=2.19.2",
    "pymediainfo==7.0.1",
    "pyreadline3>=3.5.4",
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.18.0",
    "qrcode>=8.2",
    "rich==14.2.0",
    "pyaes>=1.6.1",
    "pysocks>=1.7.1",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0,<14.0",  # uvicorn 0.49.0 需要 legacy server 协议，websockets 14+ 已移除
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "sqlmodel>=0.0.16",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.0",
    "python-multipart>=0.0.5",
]

[tool.setuptools.packages.find]
include = ["module*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "freezegun>=1.2.0",
    "datamodel-code-generator>=0.25.0",
]
build = [
    "nuitka>=2.0.0",
    "zstandard>=0.20.0",
]
e2e = [
    "pytest-playwright>=0.4.0",
    "playwright>=1.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# 以下规则为项目约定或需人工判断的语义类告警，按本次改动文件范围筛除：
# - B008: FastAPI 依赖注入 / 工具函数默认参数（框架约定）
# - BLE001、S110: 项目广泛使用的盲捕获 / try-except-pass 风格
# - RUF059: 测试 fixture 固定解包约定（ac, app, token = client）
# - B006、B023、TRY201、TRY203、RUF012、RUF013、SIM102、SIM103: 需人工判断的语义类告警
"module/api/routes/tasks.py" = ["B008", "BLE001"]
# config.py：路由层盲捕获统一风格（与 tasks.py 约定一致），导入排序已修复
"module/api/routes/config.py" = ["BLE001"]
# monitor.py 路由：盲捕获统一风格（与 config.py 约定一致）
"module/api/routes/monitor.py" = ["BLE001"]
# legacy_config.py：旧架构遗留语义/风格告警（盲捕获/可变类默认值/隐式 Optional/时区/导入顺序等），
# 属历史存量，非本次只读挂载修复引入，按项目约定以 per-file 方式忽略
"module/core/legacy_config.py" = ["BLE001", "DTZ005", "DTZ007", "I001", "PIE790", "RUF012", "S110", "SIM118", "UP007"]
"module/core/download/client.py" = ["B006", "B008", "B023", "BLE001", "RUF013", "SIM102", "TRY201", "TRY203"]
# downloader.py：旧架构遗留语义告警（盲捕获/时区/裸异常/隐式 Optional 等），
# 属历史存量，非本次桥接改动引入，按项目约定以 per-file 方式忽略
"module/core/download/downloader.py" = ["ASYNC230", "BLE001", "C401", "C403", "DTZ006", "DTZ007", "RUF013", "S110", "SIM102", "SIM113", "TRY002"]
# bot_bridge.py：桥接边界捕获 Exception 收集失败链接（与 integration.py 约定一致）
"module/bot/bot_bridge.py" = ["BLE001"]
# executor.py：旧架构遗留语义/风格告警（盲捕获/隐式 Optional/时区写法等），
# 属历史存量，非本次桥接改动引入，按项目约定以 per-file 方式忽略
"module/core/task/executor.py" = ["B023", "BLE001", "RUF019", "S110", "UP017", "UP035", "UP045"]
"module/core/integration.py" = ["BLE001", "S110"]
# monitor.py：监控模块存量盲捕获 / try-except-pass / 函数内导入风格
"module/core/monitor.py" = ["BLE001", "S110", "I001"]
"module/core/task/manager.py" = ["RUF012", "SIM103"]
# notifier.py：通知为尽力而为，任意发送异常都不应影响任务状态流转（与 executor.py 旧口径一致）
"module/core/task/notifier.py" = ["BLE001"]
"tests/unit/api/test_web_api.py" = ["RUF059"]
"tests/unit/bot/test_bot_bridge.py" = ["RUF059"]
"tests/unit/core/task/test_executor.py" = ["I001", "RUF015", "UP017"]
"tests/unit/core/task/test_manager.py" = ["RUF059"]
# test_downloader.py：嵌套 with 属存量测试风格（ruff 无法自动合并含 as 绑定的上下文），
# 按项目约定以 per-file 方式忽略
"tests/unit/core/download/test_downloader.py" = ["SIM117"]
