services:
  trmd:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${HOST_PORT}:8000"
    volumes:
      # 配置（可写挂载，支持 WebUI 保存配置）
      - ./config/config.yaml:/app/config.yaml
      - ./data/.trmd:/app/.trmd
      # 日志（目录挂载，自动持久化日志与轮转/备份文件）
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./downloads:/app/downloads
      - ./temp:/app/temp
      - ./form:/app/form
    environment:
      - TZ=${TZ}
      - TRMD_WEBUI_URL=${TRMD_WEBUI_URL:-}
    networks:
      - npm-network

# ---------- 在文件末尾新增网络声明 ----------
networks:
  npm-network:
    external: true
    name: npm-network