<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统配置 - Telegram Restricted Media Downloader</title>
  
  <!-- Tailwind 自定义配置 -->
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a',
            },
            slate: {
              850: '#1e293b', 900: '#0f172a', 950: '#020617',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Tailwind CSS (本地) -->
  <script src="vendor/tailwindcss.js"></script>
  
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 min-h-screen">
  <div 
    x-data="configPage()"
    x-init="init()"
    class="flex min-h-screen"
  >
    <!-- 移动端侧边栏遮罩 -->
    <div 
      x-show="mobileSidebarOpen" x-cloak
      x-transition:enter="transition-opacity ease-linear duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition-opacity ease-linear duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 bg-black/50 z-40 lg:hidden"
      @click="mobileSidebarOpen = false"
    ></div>

    <!-- 侧边栏 -->
    <aside 
      :class="mobileSidebarOpen ? 'translate-x-0' : '-translate-x-full'"
      class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-800 border-r border-slate-700 transform transition-transform duration-300 lg:translate-x-0 lg:static lg:inset-0"
    >
      <div class="flex items-center h-16 px-6 border-b border-slate-700">
        <div class="flex items-center">
          <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m0 0V7a3 3 0 013-3h4a3 3 0 013 3v4m-4 4l-4 4m0 0l-4-4m0-8v-2m0 6V8m0 0l4 4m-4-4l4-4"></path>
            </svg>
          </div>
          <span class="ml-3 text-lg font-bold text-white">TRMD</span>
        </div>
      </div>

      <nav class="mt-4 px-4 space-y-1">
        <a href="index.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="tasks.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
          </svg>
          <span>任务管理</span>
        </a>
        <a href="files.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
          </svg>
          <span>文件管理</span>
        </a>
        <a href="config.html" class="sidebar-link active">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span>系统配置</span>
        </a>
      </nav>

      <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-700">
        <div class="flex items-center">
          <div class="w-8 h-8 bg-slate-600 rounded-full flex items-center justify-center">
            <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <div class="ml-3 flex-1 min-w-0">
            <p class="text-sm font-medium text-white truncate" x-text="userName"></p>
            <p class="text-xs text-slate-400">在线</p>
          </div>
          <button @click="logout" class="text-slate-400 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 lg:px-6">
        <div class="flex items-center">
          <button @click="mobileSidebarOpen = true" class="lg:hidden mr-4 text-slate-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <h1 class="text-xl font-semibold text-white">系统配置</h1>
        </div>
        <div class="flex items-center space-x-3">
          <button 
            x-show="(_ut, configManager.hasChanges)"
            @click="configManager.resetConfig(); _tu()"
            class="btn btn-secondary"
            data-testid="reset-btn"
          >
            重置
          </button>
          <button 
            x-show="(_ut, configManager.hasChanges)"
            @click="handleSaveConfig()"
            :disabled="(_ut, configManager.saving)"
            class="btn btn-primary"
            data-testid="save-btn"
          >
            <svg x-show="(_ut, configManager.saving)" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span x-text="(_ut, configManager.saving) ? '保存中...' : '保存配置'"></span>
          </button>
        </div>
      </header>

      <main class="flex-1 p-4 lg:p-6 overflow-y-auto">
        <!-- 通知 -->
        <div class="fixed top-4 right-4 z-50 space-y-2 max-w-sm">
          <template x-for="(notification, index) in notifications" :key="index">
            <div 
              x-show="true"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0 translate-y-2"
              x-transition:enter-end="opacity-100 translate-y-0"
              x-transition:leave="transition ease-in duration-300"
              x-transition:leave-start="opacity-100 translate-y-0"
              x-transition:leave-end="opacity-0 translate-y-2"
              :class="{
                'bg-slate-800 border-l-4 border-blue-500': notification.type === 'info',
                'bg-slate-800 border-l-4 border-green-500': notification.type === 'success',
                'bg-slate-800 border-l-4 border-yellow-500': notification.type === 'warning',
                'bg-slate-800 border-l-4 border-red-500': notification.type === 'error',
              }"
              class="p-4 rounded-lg shadow-lg"
            >
              <div class="flex items-start">
                <div class="flex-1">
                  <p class="text-sm text-white" x-text="notification.message"></p>
                </div>
                <button @click="notifications.splice(index, 1)" class="ml-3 text-slate-400 hover:text-white">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>
            </div>
          </template>
        </div>

        <!-- 加载状态 -->
        <div x-show="(_ut, configManager.loading)" class="flex items-center justify-center py-12" data-testid="loading-indicator">
          <div class="spinner spinner-lg"></div>
          <span class="ml-3 text-slate-400">加载配置...</span>
        </div>

        <!-- 错误提示 -->
        <div x-show="(_ut, configManager.error && !configManager.loading)" class="bg-red-900/30 border border-red-700 text-red-300 px-4 py-3 rounded-lg mb-6" data-testid="config-error">
          <p class="text-sm" x-text="(_ut, configManager.error) || ''"></p>
        </div>

        <!-- 成功提示 -->
        <div x-show="(_ut, configManager.success)" class="bg-green-900/30 border border-green-700 text-green-300 px-4 py-3 rounded-lg mb-6" data-testid="config-success">
          <p class="text-sm">配置保存成功！</p>
        </div>

        <!-- 配置内容 -->
        <div x-show="!configManager.loading" class="space-y-6">
          <!-- 标签页导航 -->
          <div class="card p-0 overflow-hidden">
            <div class="tabs">
              <button 
                @click="setActiveTab('basic')"
                :class="isTabActive('basic') ? 'tab active' : 'tab'"
                data-testid="tab-basic"
              >
                基础配置
              </button>
              <button 
                @click="setActiveTab('download')"
                :class="isTabActive('download') ? 'tab active' : 'tab'"
                data-testid="tab-download"
              >
                下载配置
              </button>
              <button 
                @click="setActiveTab('upload')"
                :class="isTabActive('upload') ? 'tab active' : 'tab'"
                data-testid="tab-upload"
              >
                上传配置
              </button>
              <button 
                @click="setActiveTab('proxy')"
                :class="isTabActive('proxy') ? 'tab active' : 'tab'"
                data-testid="tab-proxy"
              >
                代理配置
              </button>
              <button 
                @click="setActiveTab('notification')"
                :class="isTabActive('notification') ? 'tab active' : 'tab'"
                data-testid="tab-notification"
              >
                通知配置
              </button>
              <button 
                @click="setActiveTab('resource')"
                :class="isTabActive('resource') ? 'tab active' : 'tab'"
                data-testid="tab-resource"
              >
                资源限制
              </button>
            </div>
          </div>

          <!-- 基础配置 -->
          <div x-show="isTabActive('basic')" class="card" data-testid="panel-basic">
            <div class="card-header">
              <h2 class="card-title">基础配置</h2>
            </div>
            <div class="space-y-4">
              <div class="form-group">
                <label class="form-label">API ID *</label>
                <input
                  type="text"
                  :value="(_ut, configManager.config.api_id)"
                  @input="configManager.updateConfigValue('api_id', $event.target.value); _tu()"
                  class="form-input"
                  placeholder="从 my.telegram.org 获取"
                  required
                  data-testid="input-api-id"
                >
              </div>
              <div class="form-group">
                <label class="form-label">API Hash *</label>
                <input
                  type="password"
                  :value="(_ut, configManager.config.api_hash)"
                  @input="configManager.updateConfigValue('api_hash', $event.target.value); _tu()"
                  class="form-input"
                  placeholder="从 my.telegram.org 获取"
                  required
                  data-testid="input-api-hash"
                >
              </div>
              <div class="form-group">
                <label class="form-label">Bot Token</label>
                <input
                  type="password"
                  :value="(_ut, configManager.config.bot_token)"
                  @input="configManager.updateConfigValue('bot_token', $event.target.value); _tu()"
                  class="form-input"
                  placeholder="从 @BotFather 获取"
                  data-testid="input-bot-token"
                >
              </div>
              <div class="form-group">
                <label class="form-label">工作目录</label>
                <input
                  type="text"
                  :value="(_ut, configManager.config.work_dir)"
                  @input="configManager.updateConfigValue('work_dir', $event.target.value); _tu()"
                  class="form-input"
                  placeholder="默认：./downloads"
                  data-testid="input-work-dir"
                >
              </div>
            </div>
          </div>

          <!-- 下载配置 -->
          <div x-show="isTabActive('download')" class="card" data-testid="tab-content-download">
            <div class="card-header">
              <h2 class="card-title">下载配置</h2>
            </div>
            <div class="space-y-4">
              <div class="form-group">
	                <label class="form-label">下载类型</label>
	                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
	                  <template x-for="option in configManager.getDownloadTypeOptions()" :key="option.value">
	                    <label class="flex items-center cursor-pointer p-3 bg-slate-700/50 rounded-lg hover:bg-slate-700 transition-colors">
	                      <input
	                        type="checkbox"
	                        :checked="(_ut, configManager.isDownloadTypeSelected(option.value))"
	                        @change="configManager.toggleDownloadType(option.value); _tu()"
	                        class="mr-2"
	                      >
                      <span x-text="option.icon + ' ' + option.label"></span>
                    </label>
                  </template>
                </div>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
	                <div class="form-group">
	                  <label class="form-label">下载并发数</label>
	                  <input
		                    type="number"
		                    :value="(_ut, configManager.config.max_download_task)"
		                    @input="configManager.updateConfigValue('max_download_task', $event.target.value); _tu()"
		                    class="form-input"
		                    min="1"
		                    max="10"
		                    data-testid="input-max-download-task"
		                  >
	                  <p class="text-xs text-slate-500 mt-1">范围：1-10</p>
	                </div>
	                <div class="form-group">
	                  <label class="form-label">重试次数</label>
	                  <input
		                    type="number"
		                    :value="(_ut, configManager.config.retry_count)"
		                    @input="configManager.updateConfigValue('retry_count', $event.target.value); _tu()"
		                    class="form-input"
		                    min="0"
		                    data-testid="input-retry-count"
		                  >
	                  <p class="text-xs text-slate-500 mt-1">失败后自动重试次数</p>
	                </div>
	              </div>
            </div>
          </div>

          <!-- 上传配置 -->
          <div x-show="isTabActive('upload')" class="card" data-testid="tab-content-upload">
            <div class="card-header">
              <h2 class="card-title">上传配置</h2>
            </div>
            <div class="space-y-4">
	              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
	                <div class="form-group">
	                  <label class="form-label">上传并发数</label>
	                  <input
		                    type="number"
		                    :value="(_ut, configManager.config.max_upload_task)"
		                    @input="configManager.updateConfigValue('max_upload_task', $event.target.value); _tu()"
		                    class="form-input"
		                    min="1"
		                    max="10"
		                    data-testid="input-max-upload-task"
		                  >
	                  <p class="text-xs text-slate-500 mt-1">范围：1-10</p>
	                </div>
	                <div class="form-group">
	                  <label class="form-label">媒体组大小</label>
	                  <input
		                    type="number"
		                    :value="(_ut, configManager.config.media_group_size)"
		                    @input="configManager.updateConfigValue('media_group_size', $event.target.value); _tu()"
		                    class="form-input"
		                    min="1"
		                    max="10"
		                    data-testid="input-media-group-size"
		                  >
	                  <p class="text-xs text-slate-500 mt-1">Telegram 媒体组上限为 10</p>
	                </div>
	              </div>
	              <div class="form-group">
	                <label class="form-label">默认发送方式</label>
	                <select
		                  :value="(_ut, configManager.config.default_send_method)"
		                  @change="configManager.updateConfigValue('default_send_method', $event.target.value); _tu()"
		                  class="form-input form-select"
		                  data-testid="select-send-method"
		                >
	                  <option value="media">媒体文件</option>
	                  <option value="document">文档</option>
	                </select>
	              </div>
	            </div>
          </div>

          <!-- 代理配置 -->
          <div x-show="isTabActive('proxy')" class="card" data-testid="tab-content-proxy">
            <div class="card-header">
              <h2 class="card-title">代理配置</h2>
            </div>
            <div class="space-y-4">
              <div class="form-group">
                <label class="flex items-center cursor-pointer">
                  <input
		                    type="checkbox"
		                    :checked="(_ut, configManager.config.proxy_enabled === true || configManager.config.proxy_enabled === 'true')"
		                    @change="configManager.updateConfigValue('proxy_enabled', $event.target.checked); _tu()"
		                    class="mr-2"
		                    data-testid="checkbox-proxy-enabled"
		                  >
                  <span>启用代理</span>
                </label>
              </div>
              <div x-show="(_ut, configManager.config.proxy_enabled === true || configManager.config.proxy_enabled === 'true')" class="space-y-4 pl-6 border-l-2 border-slate-700">
                <div class="form-group">
                  <label class="form-label">代理类型</label>
                  <select
		                    :value="(_ut, configManager.config.proxy_type)"
		                    @change="configManager.updateConfigValue('proxy_type', $event.target.value); _tu()"
		                    class="form-input form-select"
		                    data-testid="select-proxy-type"
		                  >
                    <option value="socks5">SOCKS5</option>
                    <option value="http">HTTP</option>
                  </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div class="form-group">
                    <label class="form-label">代理地址</label>
                    <input
		                      type="text"
		                      :value="(_ut, configManager.config.proxy_host)"
		                      @input="configManager.updateConfigValue('proxy_host', $event.target.value); _tu()"
		                      class="form-input"
		                      placeholder="127.0.0.1"
		                      data-testid="input-proxy-host"
		                    >
                  </div>
                  <div class="form-group">
                    <label class="form-label">代理端口</label>
                    <input
		                      type="number"
		                      :value="(_ut, configManager.config.proxy_port)"
		                      @input="configManager.updateConfigValue('proxy_port', $event.target.value); _tu()"
		                      class="form-input"
		                      min="1"
		                      max="65535"
		                      placeholder="1080"
		                      data-testid="input-proxy-port"
		                    >
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div class="form-group">
                    <label class="form-label">用户名（可选）</label>
                    <input
	                      type="text"
	                      :value="(_ut, configManager.config.proxy_username)"
	                      @input="configManager.updateConfigValue('proxy_username', $event.target.value); _tu()"
	                      class="form-input"
	                      placeholder="留空表示无认证"
	                      data-testid="input-proxy-username"
	                    >
                  </div>
                  <div class="form-group">
                    <label class="form-label">密码（可选）</label>
                    <input
	                      type="password"
	                      :value="(_ut, configManager.config.proxy_password)"
	                      @input="configManager.updateConfigValue('proxy_password', $event.target.value); _tu()"
	                      class="form-input"
	                      placeholder="留空表示无认证"
	                      data-testid="input-proxy-password"
	                    >
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- 通知配置 -->
          <div x-show="isTabActive('notification')" class="card" data-testid="tab-content-notification">
            <div class="card-header">
              <h2 class="card-title">通知配置</h2>
            </div>
            <div class="space-y-4">
              <div class="form-group">
                <label class="flex items-center cursor-pointer">
                  <input
	                    type="checkbox"
	                    :checked="(_ut, configManager.config.notification_enabled === true || configManager.config.notification_enabled === 'true')"
	                    @change="configManager.updateConfigValue('notification_enabled', $event.target.checked); _tu()"
	                    class="mr-2"
	                    data-testid="checkbox-notification-enabled"
	                  >
                  <span>启用完成通知</span>
                </label>
                <p class="text-xs text-slate-500 mt-1">任务完成后发送通知到 Bot</p>
              </div>
              <div class="form-group">
                <label class="flex items-center cursor-pointer">
                  <input
	                    type="checkbox"
	                    :checked="(_ut, configManager.config.error_notification_enabled === true || configManager.config.error_notification_enabled === 'true')"
	                    @change="configManager.updateConfigValue('error_notification_enabled', $event.target.checked); _tu()"
	                    class="mr-2"
	                    data-testid="checkbox-error-notification"
	                  >
                  <span>启用错误通知</span>
                </label>
                <p class="text-xs text-slate-500 mt-1">任务失败时发送通知到 Bot</p>
              </div>
            </div>
          </div>

          <!-- 资源限制 -->
          <div x-show="isTabActive('resource')" class="card" data-testid="tab-content-resource">
            <div class="card-header">
              <h2 class="card-title">资源限制</h2>
            </div>
            <div class="space-y-4">
              <div class="form-group">
                <label class="form-label">最大并发任务数</label>
                <input
	                  type="number"
	                  :value="(_ut, configManager.config.max_concurrent_tasks)"
	                  @input="configManager.updateConfigValue('max_concurrent_tasks', $event.target.value); _tu()"
	                  class="form-input"
	                  min="1"
	                  data-testid="input-max-concurrent-tasks"
	                >
                <p class="text-xs text-slate-500 mt-1">同时运行的最大任务数</p>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group">
                  <label class="form-label">任务大小告警阈值 (GB)</label>
                  <input
	                    type="number"
	                    :value="(_ut, configManager.config.task_size_warning_gb)"
	                    @input="configManager.updateConfigValue('task_size_warning_gb', $event.target.value); _tu()"
	                    class="form-input"
	                    min="1"
	                    step="0.5"
	                    data-testid="input-task-size-warning"
	                  >
                  <p class="text-xs text-slate-500 mt-1">超过此大小将弹出告警</p>
                </div>
                <div class="form-group">
                  <label class="form-label">任务大小最大阈值 (GB)</label>
                  <input
	                    type="number"
	                    :value="(_ut, configManager.config.task_size_max_gb)"
	                    @input="configManager.updateConfigValue('task_size_max_gb', $event.target.value); _tu()"
	                    class="form-input"
	                    min="1"
	                    step="0.5"
	                    data-testid="input-task-size-max"
	                  >
                  <p class="text-xs text-slate-500 mt-1">超过此大小将禁止创建任务</p>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">最小磁盘空间 (GB)</label>
                <input
	                  type="number"
	                  :value="(_ut, configManager.config.min_disk_space_gb)"
	                  @input="configManager.updateConfigValue('min_disk_space_gb', $event.target.value); _tu()"
	                  class="form-input"
	                  min="1"
	                  step="0.5"
	                  data-testid="input-min-disk-space"
	                >
                <p class="text-xs text-slate-500 mt-1">磁盘空间低于此值时将禁止创建任务</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- JavaScript 文件 -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script>
    /**
     * 配置页面逻辑
     */
    function configPage() {
      return {
        mobileSidebarOpen: false,
        userName: '用户',
        notifications: [],
        activeTab: 'basic', // Alpine 响应式状态，用于标签页切换
        _ut: 0, // 更新触发器：递增时强制 Alpine 重新评估 configManager 相关表达式

        async init() {
          const authenticated = await authManager.ensureAuthenticated();
          if (!authenticated) return;

          this.userName = authManager.getDisplayName();
          await configManager.loadConfig();
          this._tu();
        },

        /**
         * 递增更新触发器，强制 Alpine 重新评估依赖 configManager 状态的表达式。
         * 因为 configManager 是全局非响应式对象，Alpine 无法自动检测其变更。
         * 在每次修改 configManager 状态后调用此方法。
         */
        _tu() { this._ut++; },

        setActiveTab(tab) {
          this.activeTab = tab;
          configManager.setActiveTab(tab);
        },

        isTabActive(tab) {
          return this.activeTab === tab;
        },

        async handleSaveConfig() {
          try {
            await configManager.saveConfig();
            this.addNotification('success', '配置保存成功');
          } catch (error) {
            this.addNotification('error', `保存失败: ${error.message}`);
          }
          this._tu();
        },

        logout() {
          authManager.logout();
        },

        addNotification(type, message) {
          this.notifications.push({ type, message });
          setTimeout(() => this.notifications.shift(), 5000);
        },
      };
    }

    // 全局通知函数
    window.showNotification = function(type, message) {
      const app = document.querySelector('[x-data]');
      if (app && window.Alpine) {
        window.Alpine.$data(app).addNotification(type, message);
      }
    };

    // 离开页面前如果有未保存的更改，给出提示
    window.addEventListener('beforeunload', function(e) {
      if (configManager && configManager.hasChanges) {
        e.preventDefault();
        e.returnValue = '';
        return '您有未保存的配置更改，确定要离开吗？';
      }
    });
  </script>

  <!-- Alpine.js (本地) - 必须在组件函数定义之后加载 -->
  <script src="vendor/alpinejs.js"></script>
</body>
</html>
