<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务管理 - Telegram Restricted Media Downloader</title>
  
  <!-- Tailwind 自定义配置 -->
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              800: '#1e40af', 900: '#1e3a8a',
            },
            slate: {
              850: '#1e293b', 900: '#0f172a', 950: '#020617',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Tailwind CSS (本地) -->
  <script src="vendor/tailwindcss.js"></script>
  
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 min-h-screen">
  <div 
    x-data="tasksPage()"
    x-init="init()"
    class="flex min-h-screen"
  >
    <!-- 移动端侧边栏遮罩 -->
    <div 
      x-show="mobileSidebarOpen" 
      x-transition:enter="transition-opacity ease-linear duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition-opacity ease-linear duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 bg-black/50 z-40 lg:hidden"
      @click="mobileSidebarOpen = false"
    ></div>

    <!-- 侧边栏 -->
    <aside 
      :class="mobileSidebarOpen ? 'translate-x-0' : '-translate-x-full'"
      class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-800 border-r border-slate-700 transform transition-transform duration-300 lg:translate-x-0 lg:static lg:inset-0"
    >
      <div class="flex items-center h-16 px-6 border-b border-slate-700">
        <div class="flex items-center">
          <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m0 0V7a3 3 0 013-3h4a3 3 0 013 3v4m-4 4l-4 4m0 0l-4-4m0-8v-2m0 6V8m0 0l4 4m-4-4l4-4"></path>
            </svg>
          </div>
          <span class="ml-3 text-lg font-bold text-white">TRMD</span>
        </div>
      </div>

      <nav class="mt-4 px-4 space-y-1">
        <a href="index.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="tasks.html" class="sidebar-link active">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
          </svg>
          <span>任务管理</span>
        </a>
        <a href="files.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
          </svg>
          <span>文件管理</span>
        </a>
        <a href="config.html" class="sidebar-link">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span>系统配置</span>
        </a>
      </nav>

      <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-700">
        <div class="flex items-center">
          <div class="w-8 h-8 bg-slate-600 rounded-full flex items-center justify-center">
            <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <div class="ml-3 flex-1 min-w-0">
            <p class="text-sm font-medium text-white truncate" x-text="userName"></p>
            <p class="text-xs text-slate-400">在线</p>
          </div>
          <button @click="logout" class="text-slate-400 hover:text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 lg:px-6">
        <div class="flex items-center">
          <button @click="mobileSidebarOpen = true" class="lg:hidden mr-4 text-slate-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <h1 class="text-xl font-semibold text-white">任务管理</h1>
        </div>
      </header>

      <main class="flex-1 p-4 lg:p-6 overflow-y-auto">
        <!-- 通知 -->
        <div data-testid="notification-container" class="fixed top-4 right-4 z-50 space-y-2 max-w-sm">
          <template x-for="(notification, index) in notifications" :key="index">
            <div data-testid="notification-item" 
              x-show="true"
              x-transition:enter="transition ease-out duration-300"
              x-transition:enter-start="opacity-0 translate-y-2"
              x-transition:enter-end="opacity-100 translate-y-0"
              x-transition:leave="transition ease-in duration-300"
              x-transition:leave-start="opacity-100 translate-y-0"
              x-transition:leave-end="opacity-0 translate-y-2"
              :class="{
                'bg-slate-800 border-l-4 border-blue-500': notification.type === 'info',
                'bg-slate-800 border-l-4 border-green-500': notification.type === 'success',
                'bg-slate-800 border-l-4 border-yellow-500': notification.type === 'warning',
                'bg-slate-800 border-l-4 border-red-500': notification.type === 'error',
              }"
              class="p-4 rounded-lg shadow-lg"
            >
              <div class="flex items-start">
                <div class="flex-1">
                  <p class="text-sm text-white" x-text="notification.message"></p>
                </div>
                <button @click="notifications.splice(index, 1)" class="ml-3 text-slate-400 hover:text-white">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>
            </div>
          </template>
        </div>

        <!-- 状态筛选 -->
        <div class="mb-6">
          <div class="flex flex-wrap gap-2">
            <button
              data-testid="filter-status-all"
              @click="setFilter('all')"
              :class="currentFilter === 'all' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              全部
            </button>
            <button
              data-testid="filter-status-running"
              @click="setFilter('running')"
              :class="currentFilter === 'running' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              执行中
            </button>
            <button
              data-testid="filter-status-pending"
              @click="setFilter('pending')"
              :class="currentFilter === 'pending' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              排队中
            </button>
            <button
              data-testid="filter-status-completed"
              @click="setFilter('completed')"
              :class="currentFilter === 'completed' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              已完成
            </button>
            <button
              data-testid="filter-status-failed"
              @click="setFilter('failed')"
              :class="currentFilter === 'failed' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              失败
            </button>
            <button
              data-testid="filter-status-cancelled"
              @click="setFilter('cancelled')"
              :class="currentFilter === 'cancelled' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              已取消
            </button>
          </div>
        </div>

        <!-- 任务类型筛选 -->
        <div class="mb-6">
          <div class="flex flex-wrap gap-2">
            <button
              data-testid="filter-type-all"
              @click="setTypeFilter('all')"
              :class="currentTypeFilter === 'all' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              全部类型
            </button>
            <button
              data-testid="filter-type-download"
              @click="setTypeFilter('download')"
              :class="currentTypeFilter === 'download' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              下载
            </button>
            <button
              data-testid="filter-type-forward"
              @click="setTypeFilter('forward')"
              :class="currentTypeFilter === 'forward' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              转发
            </button>
            <button
              data-testid="filter-type-upload"
              @click="setTypeFilter('upload')"
              :class="currentTypeFilter === 'upload' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              上传
            </button>
            <button
              data-testid="filter-type-listen-download"
              @click="setTypeFilter('listen_download')"
              :class="currentTypeFilter === 'listen_download' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              🕵️ 监听下载
            </button>
            <button
              data-testid="filter-type-listen-forward"
              @click="setTypeFilter('listen_forward')"
              :class="currentTypeFilter === 'listen_forward' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              📲 监听转发
            </button>
            <button
              data-testid="filter-type-cleanup"
              @click="setTypeFilter('cleanup_files')"
              :class="currentTypeFilter === 'cleanup_files' ? 'btn btn-primary' : 'btn btn-secondary'"
            >
              🧹 定时清理
            </button>
          </div>
        </div>

        <!-- 加载状态 -->
        <div x-show="loading" class="flex items-center justify-center py-12">
          <div class="spinner spinner-lg"></div>
          <span class="ml-3 text-slate-400">加载任务列表...</span>
        </div>

        <!-- 任务列表 -->
        <div x-show="!loading" class="card">
          <!-- 任务列表头部：标题 + 操作按钮 -->
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-white">任务列表</h2>
            <div class="flex items-center space-x-3">
              <!-- 手动刷新按钮 -->
              <button
                data-testid="btn-refresh-tasks"
                @click="manualRefresh()"
                class="btn btn-secondary"
                :class="{ 'opacity-50': loading }"
                :disabled="loading"
                title="刷新任务列表"
              >
                <svg class="w-5 h-5" :class="{ 'animate-spin': loading }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <span>刷新</span>
                <!-- 显示最后同步时间 -->
                <span x-show="lastSyncTime" class="text-xs text-slate-400 ml-2 hidden lg:inline">
                  <span x-text="lastSyncTime"></span>
                </span>
              </button>
              <button data-testid="btn-create-task" @click="openCreateModal()" class="btn btn-primary">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>新建任务</span>
              </button>
            </div>
          </div>

          <div x-show="tasks.length === 0" class="py-8 text-center">
            <svg class="w-12 h-12 mx-auto text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <p class="text-slate-400 mt-2">暂无任务</p>
          </div>

          <div x-show="tasks.length > 0" class="overflow-x-auto">
            <table data-testid="tasks-table" class="table">
              <thead data-testid="tasks-table-header">
                <tr>
                  <th>ID</th>
                  <th>类型</th>
                  <th>状态</th>
                  <th>进度</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody data-testid="tasks-table-body">
                <template x-for="task in tasks" :key="task.id">
                  <tr
                    :data-testid="`task-row-${task.id}`"
                    @click="viewTaskDetail(task)"
                    class="cursor-pointer"
                  >
                    <td data-testid="task-id" class="font-mono text-sm" x-text="`#${task.id}`"></td>
                    <td data-testid="task-type">
                      <span x-text="taskManager.getTypeText(task.task_type)"></span>
                    </td>
                    <td data-testid="task-status">
                      <span
                        class="badge"
                        :class="taskManager.getStatusBadgeClass(task.status)"
                        x-text="taskManager.getStatusText(task.status)"
                      ></span>
                    </td>
                    <td data-testid="task-progress" class="min-w-[140px]">
                      <!-- 监听任务：显示"监听中" -->
                      <div x-show="task.task_type && task.task_type.startsWith('listen_')" class="text-sm text-blue-400">
                        <span x-show="task.status === 'running'">🕵️ 监听中</span>
                        <span x-show="task.status !== 'running'" x-text="taskManager.getStatusText(task.status)"></span>
                      </div>
                      <!-- 非监听任务：显示进度条 -->
                      <div x-show="!task.task_type || !task.task_type.startsWith('listen_')" class="flex items-center gap-2">
                        <div class="progress-bar flex-1">
                          <div
                            class="progress-bar-fill"
                            :style="`width: ${task.progress || 0}%`"
                            :class="{
                              'success': task.status === 'completed',
                              'error': task.status === 'failed',
                            }"
                          ></div>
                        </div>
                        <span class="text-xs text-slate-400 w-10" x-text="`${Number(task.progress || 0).toFixed(2)}%`"></span>
                      </div>
                    </td>
                    <td data-testid="task-created-at" class="text-sm text-slate-400" x-text="taskManager.formatTime(task.created_at)"></td>
                    <td data-testid="task-actions" class="space-x-2">
                      <button
                        data-testid="btn-task-start"
                        x-show="task.status === 'pending'"
                        @click.stop="startTask(task.id)"
                        class="btn btn-sm btn-success"
                      >
                        启动
                      </button>
                      <button
                        data-testid="btn-task-cancel"
                        x-show="task.status === 'running' || task.status === 'queued'"
                        @click.stop="cancelTask(task.id)"
                        class="btn btn-sm btn-warning"
                      >
                        取消
                      </button>
                      <button
                        data-testid="btn-task-retry"
                        x-show="task.status === 'failed'"
                        @click.stop="retryTask(task.id)"
                        class="btn btn-sm btn-primary"
                      >
                        重试
                      </button>
                      <button
                        data-testid="btn-task-delete"
                        x-show="task.status === 'pending' || task.status === 'completed' || task.status === 'cancelled' || task.status === 'failed'"
                        @click.stop="deleteTask(task.id)"
                        class="btn btn-sm btn-error"
                      >
                        删除
                      </button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- 分页 -->
          <div data-testid="pagination-info" x-show="totalPages > 1" class="mt-4 flex items-center justify-between">
            <p class="text-sm text-slate-400">
              共 <span x-text="totalTasks"></span> 个任务，第 <span x-text="currentPage"></span> / <span x-text="totalPages"></span> 页
            </p>
            <div class="flex gap-2">
              <button
                data-testid="btn-pagination-prev"
                @click="prevPage()"
                :disabled="currentPage <= 1"
                class="btn btn-sm btn-secondary"
              >
                上一页
              </button>
              <button
                data-testid="btn-pagination-next"
                @click="nextPage()"
                :disabled="currentPage >= totalPages"
                class="btn btn-sm btn-secondary"
              >
                下一页
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- 任务详情抽屉 -->
    <div
      data-testid="drawer-task-detail"
      x-show="showDetailDrawer"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 bg-black/50 z-50"
      @click="closeDetailDrawer()"
    >
      <div
        x-show="showDetailDrawer"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="translate-x-full"
        x-transition:enter-end="translate-x-0"
        x-transition:leave="transition ease-in duration-300"
        x-transition:leave-start="translate-x-0"
        x-transition:leave-end="translate-x-full"
        class="absolute right-0 top-0 bottom-0 w-full max-w-lg bg-slate-800 border-l border-slate-700 overflow-y-auto"
        @click.stop
      >
        <template x-if="selectedTask">
          <div>
            <div class="drawer-header">
              <h3 class="text-lg font-semibold text-white">任务详情</h3>
              <button data-testid="btn-close-detail" @click="closeDetailDrawer()" class="text-slate-400 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
            </div>
            <div class="drawer-body space-y-5">
              <!-- 任务 ID + 复制 -->
              <div>
                <p class="text-sm text-slate-400 mb-1">任务 ID</p>
                <div class="flex items-center gap-2">
                  <code data-testid="detail-task-id" class="flex-1 text-sm text-primary-300 bg-slate-900 px-3 py-2 rounded font-mono break-all" x-text="selectedTask.id"></code>
                  <button data-testid="btn-copy-task-id" @click="navigator.clipboard.writeText(selectedTask.id)" class="btn btn-secondary btn-sm shrink-0" title="复制 ID">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- 类型 + 状态 -->
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <p class="text-sm text-slate-400">任务类型</p>
                  <p class="text-white mt-1" data-testid="detail-task-type" x-text="taskManager.getTypeText(selectedTask.task_type)"></p>
                </div>
                <div>
                  <p class="text-sm text-slate-400">状态</p>
                  <span
                    class="badge mt-1"
                    data-testid="detail-task-status"
                    :class="taskManager.getStatusBadgeClass(selectedTask.status)"
                    x-text="taskManager.getStatusText(selectedTask.status)"
                  ></span>
                </div>
              </div>

              <!-- 范围模式 + 类型过滤 -->
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <p class="text-sm text-slate-400">范围模式</p>
                  <p class="text-white mt-1" data-testid="detail-range-mode" x-text="taskManager.getRangeModeText(selectedTask.params?.range_mode)"></p>
                </div>
                <div>
                  <p class="text-sm text-slate-400">类型过滤</p>
                  <p class="text-white mt-1" data-testid="detail-type-filter" x-text="taskManager.formatFilterTypes(selectedTask.params?.filter_types || selectedTask.params?.media_types)"></p>
                </div>
              </div>

              <!-- 任务配置 -->
              <div class="bg-slate-900/50 rounded-lg p-4 space-y-3">
                <p class="text-xs text-slate-500 uppercase tracking-wider font-medium">任务配置</p>

                <!-- 源频道（非上传任务） -->
                <div x-show="selectedTask.task_type !== 'upload'">
                  <p class="text-sm text-slate-400">源频道</p>
                  <p class="text-white mt-1 text-sm break-all" data-testid="detail-source-identifier" x-text="selectedTask.params?.source_identifier || selectedTask.params?.chat_id || '-'"></p>
                </div>

                <!-- 目标频道 -->
                <div x-show="['forward', 'upload', 'listen_forward'].includes(selectedTask.task_type)">
                  <p class="text-sm text-slate-400">目标频道</p>
                  <p class="text-white mt-1 text-sm break-all" data-testid="detail-target-identifier" x-text="selectedTask.params?.forward_target || selectedTask.params?.target_identifier || selectedTask.params?.chat_id || '-'"></p>
                </div>

                <!-- 范围详情 -->
                <div x-show="selectedTask.params?.range_mode && selectedTask.task_type !== 'upload' && !selectedTask.task_type?.startsWith('listen_')">
                  <p class="text-sm text-slate-400">范围详情</p>
                  <p class="text-white mt-1 text-sm break-all" data-testid="detail-range-detail">
                    <template x-if="selectedTask.params.range_mode === 'id_range'">
                      <span x-text="`${selectedTask.params.min_id || '-'} — ${selectedTask.params.max_id || '-'}`"></span>
                    </template>
                    <template x-if="selectedTask.params.range_mode === 'date_range'">
                      <span x-text="`${selectedTask.params.start_date || '-'} 至 ${selectedTask.params.end_date || '-'}`"></span>
                    </template>
                    <template x-if="selectedTask.params.range_mode === 'multiple_ids'">
                      <span x-text="taskManager.formatIdList(selectedTask.params.message_list)"></span>
                    </template>
                    <template x-if="selectedTask.params.range_mode === 'recent'">
                      <span x-text="`最近 ${selectedTask.params.recent_count || '-'} 条消息`"></span>
                    </template>
                    <template x-if="selectedTask.params.range_mode === 'all'">
                      <span>处理频道全部历史消息</span>
                    </template>
                  </p>
                </div>

                <!-- 文件大小过滤 -->
                <div x-show="selectedTask.params?.min_size || selectedTask.params?.max_size">
                  <p class="text-sm text-slate-400">文件大小过滤</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-size-filter" x-text="taskManager.formatSizeFilter(selectedTask.params?.min_size, selectedTask.params?.max_size)"></p>
                </div>

                <!-- 预估大小 -->
                <div x-show="selectedTask.params?.estimated_size || selectedTask.params?.size_human">
                  <p class="text-sm text-slate-400">预估大小</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-estimated-size" x-text="`${selectedTask.params.size_human || taskManager.formatFileSize(selectedTask.params.estimated_size)} (${taskManager.formatFileSize(selectedTask.params.estimated_size)})`"></p>
                </div>

                <!-- 上传任务：文件数量 -->
                <div x-show="selectedTask.task_type === 'upload'">
                  <p class="text-sm text-slate-400">已选文件数量</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-file-count" x-text="`${(selectedTask.params?.file_paths || []).length} 个`"></p>
                </div>

                <!-- 上传任务：上传后删除本地文件 -->
                <div x-show="selectedTask.task_type === 'upload'">
                  <p class="text-sm text-slate-400">上传后删除本地文件</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-delete-after-upload" x-text="taskManager.formatBoolean(selectedTask.params?.delete_after_upload)"></p>
                </div>

                <!-- 监听任务：媒体类型 -->
                <div x-show="selectedTask.task_type?.startsWith('listen_')">
                  <p class="text-sm text-slate-400">监听媒体类型</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-media-types" x-text="taskManager.formatFilterTypes(selectedTask.params?.media_types)"></p>
                </div>

                <!-- 定时清理：保留天数 -->
                <div x-show="selectedTask.task_type === 'cleanup_files'">
                  <p class="text-sm text-slate-400">保留天数</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-cleanup-keep-days" x-text="`${selectedTask.params?.keep_days ?? '-'} 天`"></p>
                </div>

                <!-- 定时清理：调度模式 -->
                <div x-show="selectedTask.task_type === 'cleanup_files'">
                  <p class="text-sm text-slate-400">调度模式</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-cleanup-schedule" x-text="taskManager.formatScheduleText(selectedTask.params?.schedule)"></p>
                </div>

                <!-- 定时清理：下次执行时间 -->
                <div x-show="selectedTask.task_type === 'cleanup_files'">
                  <p class="text-sm text-slate-400">下次执行</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-cleanup-next-run" x-text="selectedTask.params?.paused ? '已暂停' : (taskManager.formatTime(selectedTask.params?.last_run?.next_run_at) || '-')"></p>
                </div>

                <!-- 定时清理：空目录清理 -->
                <div x-show="selectedTask.task_type === 'cleanup_files'">
                  <p class="text-sm text-slate-400">空目录清理</p>
                  <p class="text-white mt-1 text-sm" data-testid="detail-cleanup-remove-empty-dirs" x-text="taskManager.formatBoolean(selectedTask.params?.remove_empty_dirs)"></p>
                </div>

                <!-- 定时清理：最近一次统计 -->
                <div x-show="selectedTask.task_type === 'cleanup_files'">
                  <p class="text-sm text-slate-400">最近一次清理</p>
                  <div class="grid grid-cols-2 gap-2 mt-1 text-sm">
                    <p class="text-slate-300" data-testid="detail-cleanup-last-run-stats" x-text="`扫描 ${selectedTask.params?.last_run?.scanned ?? 0} / 删除 ${selectedTask.params?.last_run?.deleted ?? 0}`"></p>
                    <p class="text-slate-300" x-text="`释放 ${selectedTask.params?.last_run?.freed_bytes ? taskManager.formatFileSize(selectedTask.params.last_run.freed_bytes) : '0 B'}`"></p>
                    <p class="text-slate-300" x-text="taskManager.formatTime(selectedTask.params?.last_run?.finished_at)"></p>
                    <p class="text-slate-300" x-text="`耗时 ${taskManager.formatLastRunDuration(selectedTask.params?.last_run)}`"></p>
                  </div>
                </div>
              </div>

              <!-- 子任务统计 -->
              <div class="bg-slate-900/50 rounded-lg p-4 space-y-2">
                <p class="text-xs text-slate-500 uppercase tracking-wider font-medium">子任务统计</p>
                <div class="grid grid-cols-4 gap-3 text-center">
                  <div>
                    <p class="text-xl font-bold text-white" x-text="selectedTask.total_count || 0"></p>
                    <p class="text-xs text-slate-400">总计</p>
                  </div>
                  <div>
                    <p class="text-xl font-bold text-green-400" x-text="selectedTask.success_count || 0"></p>
                    <p class="text-xs text-slate-400">成功</p>
                  </div>
                  <div>
                    <p class="text-xl font-bold text-red-400" x-text="selectedTask.failed_count || 0"></p>
                    <p class="text-xs text-slate-400">失败</p>
                  </div>
                  <div>
                    <p class="text-xl font-bold text-yellow-400" x-text="(selectedTask.total_count || 0) - (selectedTask.success_count || 0) - (selectedTask.failed_count || 0)"></p>
                    <p class="text-xs text-slate-400">待处理</p>
                  </div>
                </div>
              </div>

              <!-- 进度条 -->
              <div>
                <p class="text-sm text-slate-400 mb-1">进度</p>
                <div class="flex items-center gap-3">
                  <div class="progress-bar flex-1">
                    <div
                      class="progress-bar-fill"
                      :style="`width: ${selectedTask.progress || 0}%`"
                    ></div>
                  </div>
                  <span class="text-sm font-medium text-white w-12 text-right" x-text="`${Number(selectedTask.progress || 0).toFixed(2)}%`"></span>
                </div>
              </div>

              <!-- 时间线 -->
              <div class="bg-slate-900/50 rounded-lg p-4 space-y-2">
                <p class="text-xs text-slate-500 uppercase tracking-wider font-medium">时间线</p>
                <div class="space-y-1.5 text-sm">
                  <div class="flex justify-between">
                    <span class="text-slate-400">创建时间</span>
                    <span class="text-white" x-text="taskManager.formatTime(selectedTask.created_at)"></span>
                  </div>
                  <div class="flex justify-between">
                    <span class="text-slate-400">最后更新</span>
                    <span class="text-white" x-text="taskManager.formatTime(selectedTask.updated_at)"></span>
                  </div>
                </div>
              </div>

              <!-- 错误信息（条件显示） -->
              <div x-show="selectedTask.message" data-testid="detail-error-message-container" class="bg-red-900/20 border border-red-800/50 rounded-lg p-4">
                <p class="text-xs text-red-400 uppercase tracking-wider font-medium mb-1">错误信息</p>
                <p class="text-sm text-red-300 break-words" data-testid="detail-error-message" x-text="selectedTask.message"></p>
              </div>

              <!-- 定时清理操作按钮 -->
              <div x-show="selectedTask.task_type === 'cleanup_files'" class="flex gap-2">
                <button
                  data-testid="btn-run-cleanup"
                  @click="runTask(selectedTask.id)"
                  class="btn btn-sm btn-primary flex-1"
                >
                  ▶ 立即清理
                </button>
                <button
                  data-testid="btn-pause-cleanup"
                  x-show="!selectedTask.params?.paused"
                  @click="pauseTask(selectedTask.id)"
                  class="btn btn-sm btn-warning flex-1"
                >
                  ⏸ 暂停调度
                </button>
                <button
                  data-testid="btn-resume-cleanup"
                  x-show="selectedTask.params?.paused"
                  @click="resumeTask(selectedTask.id)"
                  class="btn btn-sm btn-success flex-1"
                >
                  ▶ 恢复调度
                </button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- 创建任务弹窗 -->
    <div
      data-testid="modal-create-task"
      x-show="showCreateModal"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-300"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
      @click="closeCreateModal()"
    >
      <div
        x-show="showCreateModal"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-300"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
        class="bg-slate-800 rounded-lg border border-slate-700 w-full max-w-2xl max-h-[90vh] overflow-y-auto"
        @click.stop
      >
        <div class="modal-header">
          <h3 class="modal-title text-white">创建新任务</h3>
          <button data-testid="btn-close-create" @click="closeCreateModal()" class="text-slate-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <form @submit.prevent="handleCreateTask" class="space-y-4">
            <!-- 任务类型 -->
            <div class="form-group">
              <label class="form-label">任务类型</label>
              <div class="flex gap-3">
                <label class="flex items-center cursor-pointer">
                  <input data-testid="input-task-type-download" type="radio" x-model="createForm.taskType" value="download" class="mr-2">
                  <span>下载</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input data-testid="input-task-type-forward" type="radio" x-model="createForm.taskType" value="forward" class="mr-2">
                  <span>转发</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input data-testid="input-task-type-listen-download" type="radio" x-model="createForm.taskType" value="listen_download" class="mr-2">
                  <span>🕵️ 监听下载</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input data-testid="input-task-type-listen-forward" type="radio" x-model="createForm.taskType" value="listen_forward" class="mr-2">
                  <span>📲 监听转发</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input data-testid="input-task-type-cleanup" type="radio" x-model="createForm.taskType" value="cleanup_files" class="mr-2">
                  <span>🧹 定时清理</span>
                </label>
              </div>
            </div>

            <!-- 源频道 -->
            <div class="form-group" x-show="createForm.taskType !== 'cleanup_files'">
              <label class="form-label">源频道</label>
              <div class="flex gap-2">
                <input
                  data-testid="input-source-chat"
                  type="text"
                  x-model="createForm.sourceChat"
                  class="form-input flex-1"
                  placeholder="@username 或 https://t.me/xxx"
                  required
                >
                <button data-testid="btn-resolve-source" type="button" @click="resolveSourceChat()" :disabled="resolveLoading"
                        class="btn btn-secondary btn-sm whitespace-nowrap">
                  <span x-show="!resolveLoading">🔍 解析</span>
                  <span x-show="resolveLoading" class="flex items-center gap-1">
                    <span class="spinner spinner-sm"></span> 解析中...
                  </span>
                </button>
              </div>
              <!-- 解析结果卡片 -->
              <template x-if="resolveResult">
                <div class="mt-2 p-3 bg-slate-900/50 border border-slate-600 rounded-lg text-sm">
                  <div class="flex items-center justify-between">
                    <span class="text-slate-300" x-text="resolveResult.chat_name"></span>
                    <span class="badge text-xs" :class="resolveResult.has_access ? 'badge-completed' : 'badge-failed'"
                          x-text="resolveResult.has_access ? '✅ 可访问' : '❌ 无权限'"></span>
                  </div>
                  <div class="flex gap-3 mt-1 text-xs text-slate-400">
                    <span x-text="'ID: ' + resolveResult.chat_id"></span>
                    <span x-show="resolveResult.username" x-text="'@' + resolveResult.username"></span>
                    <span x-text="resolveResult.chat_type === 'private' ? '私聊' : resolveResult.chat_type === 'channel' ? '频道' : '群组'"></span>
                    <span x-show="resolveResult.message_count >= 0" x-text="resolveResult.message_count + ' 条消息'"></span>
                  </div>
                </div>
              </template>
              <!-- 解析错误 -->
              <div x-show="resolveError" class="mt-2 text-sm text-red-400" x-text="resolveError"></div>
            </div>

            <!-- 目标频道 -->
            <div class="form-group" x-show="createForm.taskType === 'forward' || createForm.taskType === 'listen_forward'">
              <label class="form-label">目标频道</label>
              <div class="flex gap-2">
                <input
                  data-testid="input-target-chat"
                  type="text"
                  x-model="createForm.targetChat"
                  class="form-input flex-1"
                  placeholder="@username 或 https://t.me/xxx"
                  required
                >
                <button data-testid="btn-resolve-target" type="button" @click="resolveTargetChat()" :disabled="resolveTargetLoading"
                        class="btn btn-secondary btn-sm whitespace-nowrap">
                  <span x-show="!resolveTargetLoading">🔍 解析</span>
                  <span x-show="resolveTargetLoading" class="flex items-center gap-1">
                    <span class="spinner spinner-sm"></span> 解析中...
                  </span>
                </button>
              </div>
              <!-- 目标解析结果卡片 -->
              <template x-if="resolveTargetResult">
                <div class="mt-2 p-3 bg-slate-900/50 border border-slate-600 rounded-lg text-sm">
                  <div class="flex items-center justify-between">
                    <span class="text-slate-300" x-text="resolveTargetResult.chat_name"></span>
                    <span class="badge text-xs" :class="resolveTargetResult.has_access ? 'badge-completed' : 'badge-failed'"
                          x-text="resolveTargetResult.has_access ? '✅ 可访问' : '❌ 无权限'"></span>
                  </div>
                  <div class="flex gap-3 mt-1 text-xs text-slate-400">
                    <span x-text="'ID: ' + resolveTargetResult.chat_id"></span>
                    <span x-show="resolveTargetResult.username" x-text="'@' + resolveTargetResult.username"></span>
                    <span x-text="resolveTargetResult.chat_type === 'private' ? '私聊' : resolveTargetResult.chat_type === 'channel' ? '频道' : '群组'"></span>
                  </div>
                </div>
              </template>
              <div x-show="resolveTargetError" class="mt-2 text-sm text-red-400" x-text="resolveTargetError"></div>
            </div>

            <!-- 消息范围模式 -->
            <div class="form-group" x-show="!createForm.taskType.startsWith('listen_') && createForm.taskType !== 'cleanup_files'">
              <label class="form-label">消息范围</label>
              <div class="flex flex-wrap gap-3 mb-3">
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.messageRangeMode" value="id_range" class="mr-2" data-testid="input-range-mode-id">
                  <span>ID 范围</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.messageRangeMode" value="date_range" class="mr-2" data-testid="input-range-mode-date">
                  <span>日期范围</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.messageRangeMode" value="multiple_ids" class="mr-2" data-testid="input-range-mode-id-list">
                  <span>ID 列表</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.messageRangeMode" value="all" class="mr-2" data-testid="input-range-mode-all">
                  <span>全部</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.messageRangeMode" value="recent" class="mr-2" data-testid="input-range-mode-recent">
                  <span>最近 N 条</span>
                </label>
              </div>

              <!-- ID 范围 -->
              <div x-show="createForm.messageRangeMode === 'id_range'" class="flex gap-3">
                <input
                  type="number"
                  x-model="createForm.minId"
                  class="form-input flex-1"
                  placeholder="最小 ID"
                  min="1"
                  data-testid="input-min-id"
                >
                <input
                  type="number"
                  x-model="createForm.maxId"
                  class="form-input flex-1"
                  placeholder="最大 ID"
                  min="1"
                  data-testid="input-max-id"
                >
              </div>

              <!-- 日期范围 -->
              <div x-show="createForm.messageRangeMode === 'date_range'" class="flex gap-3">
                <input type="date" x-model="createForm.startDate" class="form-input flex-1" data-testid="input-start-date">
                <input type="date" x-model="createForm.endDate" class="form-input flex-1" data-testid="input-end-date">
              </div>

              <!-- ID 列表 -->
              <div x-show="createForm.messageRangeMode === 'multiple_ids'">
                <textarea
                  x-model="createForm.rawItems"
                  class="form-input form-textarea"
                  placeholder="每行一个消息 ID 或链接"
                  rows="4"
                  data-testid="input-raw-items"
                ></textarea>
                <p class="text-xs text-slate-500 mt-1">
                  已解析 <span x-text="getParsedItemCount()"></span> 条
                </p>
              </div>

              <!-- 最近 N 条 -->
              <div x-show="createForm.messageRangeMode === 'recent'" class="flex items-center gap-2">
                <span class="text-sm text-slate-400">最近</span>
                <input type="number" x-model="createForm.recentCount" class="form-input w-24"
                       placeholder="N" min="1" max="1000" data-testid="input-recent-count">
                <span class="text-sm text-slate-400">条消息</span>
              </div>

              <!-- 全部消息 -->
              <div x-show="createForm.messageRangeMode === 'all'" class="p-3 bg-yellow-500/10 border border-yellow-500/30 rounded text-sm text-yellow-300">
                ⚠️ 将处理频道历史所有消息，可能耗时较长。
              </div>
            </div>

            <!-- 类型过滤 -->
            <div class="form-group" x-show="createForm.taskType !== 'cleanup_files'">
              <label class="form-label">类型过滤</label>
              <div class="flex flex-wrap gap-3">
                <template x-for="option in taskManager.getTypeFilterOptions()" :key="option.value">
                  <label class="flex items-center cursor-pointer">
                    <input
                      type="checkbox"
                      :data-testid="'checkbox-filter-type-' + option.value"
                      :value="option.value"
                      x-model="createForm.typeFilters"
                      class="mr-2"
                    >
                    <span x-text="option.icon + ' ' + option.label"></span>
                  </label>
                </template>
              </div>
            </div>

            <!-- 媒体大小过滤 -->
            <div class="form-group" x-show="!createForm.taskType.startsWith('listen_') && createForm.taskType !== 'cleanup_files'">
              <label class="form-label">文件大小过滤（可选）</label>
              <div class="flex items-center gap-2">
                <span class="text-sm text-slate-400">最小</span>
                <input type="number" x-model="createForm.minSize" class="form-input w-24" placeholder="0" min="0">
                <select x-model="createForm.minSizeUnit" class="form-select w-20">
                  <option value="MB">MB</option>
                  <option value="GB">GB</option>
                </select>
                <span class="text-sm text-slate-400 mx-2">—</span>
                <span class="text-sm text-slate-400">最大</span>
                <input type="number" x-model="createForm.maxSize" class="form-input w-24" placeholder="无限制" min="0">
                <select x-model="createForm.maxSizeUnit" class="form-select w-20">
                  <option value="MB">MB</option>
                  <option value="GB">GB</option>
                </select>
              </div>
            </div>

            <!-- 定时清理参数 -->
            <div class="form-group" x-show="createForm.taskType === 'cleanup_files'">
              <label class="form-label">保留天数</label>
              <div class="flex flex-wrap gap-3">
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.keepDaysPreset" value="1" class="mr-2" data-testid="input-keep-days-preset-1">
                  <span>1日</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.keepDaysPreset" value="3" class="mr-2" data-testid="input-keep-days-preset-3">
                  <span>3日</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.keepDaysPreset" value="7" class="mr-2" data-testid="input-keep-days-preset-7">
                  <span>7日</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.keepDaysPreset" value="30" class="mr-2" data-testid="input-keep-days-preset-30">
                  <span>30日</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.keepDaysPreset" value="custom" class="mr-2" data-testid="input-keep-days-preset-custom">
                  <span>自定义</span>

                <span class="text-sm text-slate-400">保留</span>
                <input

              <p class="text-xs text-slate-500 mt-2">将删除「最后修改时间」早于该天数的文件（跳过使用中的文件）</p>
            </div>

            <div class="form-group" x-show="createForm.taskType === 'cleanup_files'">
              <label class="form-label">调度模式</label>
              <div class="flex flex-wrap gap-3">
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.scheduleMode" value="daily" class="mr-2" data-testid="input-schedule-mode-daily">
                  <span>每天固定时刻</span>
                </label>
                <label class="flex items-center cursor-pointer">
                  <input type="radio" x-model="createForm.scheduleMode" value="interval" class="mr-2" data-testid="input-schedule-mode-interval">
                  <span>每隔 N 小时</span>
                </label>
              </div>
              <div x-show="createForm.scheduleMode === 'daily'" class="mt-2 flex items-center gap-2">
                <span class="text-sm text-slate-400">执行时刻</span>
                <input type="time" x-model="createForm.scheduleTime" class="form-input w-32" data-testid="input-schedule-time">
              </div>
              <div x-show="createForm.scheduleMode === 'interval'" class="mt-2 flex items-center gap-2">
                <span class="text-sm text-slate-400">每隔</span>
                <input
                  type="number"
                  x-model="createForm.scheduleIntervalHours"
                  class="form-input w-24"
                  placeholder="小时"
                  min="1"
                  max="72"
                  data-testid="input-schedule-interval-hours"
                >
                <span class="text-sm text-slate-400">小时（1~72）</span>
              </div>
            </div>

            <div class="form-group" x-show="createForm.taskType === 'cleanup_files'">
              <label class="flex items-center cursor-pointer">
                <input type="checkbox" x-model="createForm.removeEmptyDirs" class="mr-2" data-testid="input-remove-empty-dirs">
                <span>同时清理删除后产生的空目录</span>
              </label>
            </div>

            <!-- 错误提示 -->
            <div x-show="createFormError" class="bg-red-900/30 border border-red-700 text-red-300 px-3 py-2 rounded text-sm">
              <span x-text="createFormError"></span>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button data-testid="btn-cancel-create" @click="closeCreateModal()" class="btn btn-secondary">
            取消
          </button>
          <button data-testid="btn-submit-create" type="button" @click="handleCreateTask()" class="btn btn-primary">
            创建任务
          </button>
        </div>
      </div>

    <!-- P0-2: 资源保护告警弹窗（使用 Alpine 响应式镜像属性驱动 x-show） -->
    <div
      data-testid="modal-resource-alert"
      x-show="showResourceAlert"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 z-[60] flex items-center justify-center bg-black bg-opacity-50"
    >
      <div class="bg-slate-800 rounded-lg shadow-xl max-w-md w-full mx-4 p-6 border border-slate-700"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100">

        <!-- 标题 -->
        <div class="flex items-center mb-4">
          <span class="text-2xl mr-3"
                x-text="resourceAlertType === 'blocked' ? '❌' : '⚠️'"></span>
          <h3 class="text-lg font-semibold text-white"
              x-text="resourceAlertType === 'blocked' ? '任务超出限制' : '资源告警'"></h3>
        </div>

        <!-- 告警内容 -->
        <div class="space-y-3 mb-6 text-sm text-slate-300">
          <p class="font-medium text-white"
             x-text="resourceAlertMessage"></p>

          <!-- 估算详情 -->
          <div x-show="resourceEstimate"
               class="bg-slate-900/50 border border-slate-600 rounded-lg p-3 space-y-1">
            <p><span class="font-medium text-slate-400">消息总数:</span>
               <span x-text="resourceEstimate?.message_count || '未知'"></span> 条</p>
            <p><span class="font-medium text-slate-400">预估大小:</span>
               <span x-text="resourceEstimate?.total_size_human || '未知'"></span></p>
            <p><span class="font-medium text-slate-400">预估耗时:</span>
               约 <span x-text="Math.round((resourceEstimate?.estimated_duration_seconds || 0) / 60)"></span> 分钟</p>

          <!-- 建议 -->
          <p x-show="resourceSuggestion"

        </div>

        <!-- 操作按钮 -->
        <div class="flex justify-end space-x-3">
          <!-- 告警模式：返回修改 + 确认创建 -->
          <template x-if="resourceAlertType === 'warning'">
            <div class="flex space-x-3">
              <button @click="closeResourceAlert()"
                      class="px-4 py-2 border border-slate-600 rounded-md text-sm font-medium
                             text-slate-300 bg-slate-700 hover:bg-slate-600 focus:outline-none
                             focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-800 focus:ring-blue-500">
                返回修改
              </button>
              <button @click="confirmCreateFromAlert()"
                      class="px-4 py-2 border border-transparent rounded-md text-sm font-medium
                             text-white bg-blue-600 hover:bg-blue-700 focus:outline-none
                             focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-800 focus:ring-blue-500">
                确认创建
              </button>
            </div>
          </template>

          <!-- 禁止模式：仅关闭按钮 -->
          <template x-if="resourceAlertType === 'blocked'">
            <button @click="closeResourceAlert()"
                    class="px-4 py-2 border border-transparent rounded-md text-sm font-medium
                           text-white bg-blue-600 hover:bg-blue-700 focus:outline-none
                           focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-800 focus:ring-blue-500 w-full">
              我知道了

          </template>
        </div>
      </div>
    </div>

  <!-- 通用确认对话框组件 (P2-3: 替代原生 confirm) -->
  <div x-data="{ dialog: window.confirmDialog }"
       x-show="dialog.visible"
       data-testid="confirm-dialog"
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-[70] flex items-center justify-center bg-black bg-opacity-50">

    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 scale-95"
          x-transition:enter-end="opacity-100 scale-100">

      <!-- 标题栏 -->
      <div class="flex items-center mb-4">
        <span class="text-2xl mr-3"
              x-text="dialog.icons[dialog.type] || ''"></span>
        <h3 class="text-lg font-semibold text-gray-900 flex-1"
            x-text="dialog.title"></h3>

        <!-- 关闭按钮 -->
        <button @click="dialog.onCancel()"
                class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- 消息内容（支持 HTML） -->
      <div class="mb-6 text-sm text-gray-600 whitespace-pre-wrap"
           x-html="dialog.message">
      </div>

      <!-- 操作按钮 -->
      <div class="flex justify-end space-x-3">
        <!-- 取消按钮 -->
        <button x-show="dialog.showCancel"
                data-testid="btn-confirm-cancel"
                @click="dialog.onCancel()"
                class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium 
                       text-gray-700 bg-white hover:bg-gray-50 focus:outline-none 
                       focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
          <span x-text="dialog.cancelText"></span>
        </button>

        <!-- 确认按钮（根据 type 变色） -->
        <template x-if="dialog.type === 'danger'">
          <button data-testid="btn-confirm-ok"
                  @click="dialog.onConfirm()"
                  class="px-4 py-2 border border-transparent rounded-md text-sm font-medium 
                         text-white bg-red-600 hover:bg-red-700 focus:outline-none 
                         focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-colors">
            <span x-text="dialog.confirmText"></span>
          </button>
        </template>

        <template x-if="dialog.type !== 'danger'">
          <button data-testid="btn-confirm-ok"
                  @click="dialog.onConfirm()"
                  class="px-4 py-2 border border-transparent rounded-md text-sm font-medium 
                         text-white bg-blue-600 hover:bg-blue-700 focus:outline-none 
                         focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
            <span x-text="dialog.confirmText"></span>
          </button>

      </div>
    </div>

  <!-- JavaScript 文件 -->
  <script src="js/api.js?v=2026071301"></script>
  <script src="js/auth.js?v=2026071301"></script>
  <script src="js/tasks.js?v=2026071301"></script>
  <script src="js/config.js?v=2026071301"></script>
  <script>
    /**
     * 任务页面逻辑
     */
    function tasksPage() {
      return {
        mobileSidebarOpen: false,
        userName: '用户',
        notifications: [],
        createFormError: null,
        showCreateModal: false, // Alpine 响应式状态
        createForm: { // Alpine 响应式状态
          taskType: 'download',
          sourceChat: '',
          targetChat: '',
          messageRangeMode: 'id_range',
          minId: 0,
          maxId: 0,
          startDate: '',
          endDate: '',
          rawItems: '',
          recentCount: '',
          typeFilters: [],
          minSize: '', maxSize: '',
          minSizeUnit: 'MB', maxSizeUnit: 'MB',
        },

        // Alpine 可追踪的本地数据副本（解决响应式失效）
        tasks: [],
        loading: false,
        selectedTask: null,
        showDetailDrawer: false,
        lastSyncTime: null, // 最后同步时间显示

        // 解析相关状态
        resolveLoading: false,
        resolveError: null,
        resolveResult: null,
        resolveTargetLoading: false,
        resolveTargetError: null,
        resolveTargetResult: null,

        // 资源告警响应式镜像（taskManager.showResourceAlert 是非响应式全局对象，
        // Alpine 无法自动检测其变更，需通过响应式属性同步以驱动 x-show 更新）
        showResourceAlert: false,
        resourceAlertType: null,
        resourceAlertMessage: '',
        resourceSuggestion: '',
        resourceEstimate: null,

        // 分页响应式镜像（taskManager.totalPages/totalTasks/page 是非响应式全局对象，
        // Alpine 无法自动检测其变更，需通过响应式属性同步以驱动 x-show/x-text 更新）
        totalPages: 0,
        totalTasks: 0,
        currentPage: 1,

        // 筛选响应式镜像（taskManager.filter/typeFilter 是非响应式全局对象，
        // Alpine 无法自动检测其变更，需通过响应式属性同步以驱动 :class 更新）
        currentFilter: 'all',
        currentTypeFilter: 'all',

        // 翻页/筛选导航标志：阻止智能轮询的 loadTasks() 覆盖导航请求的结果
        _navigating: false,

        async init() {
          const authenticated = await authManager.ensureAuthenticated();
          if (!authenticated) return;

          this.userName = authManager.getDisplayName();

          // 初始加载任务到 Alpine 本地数据
          await this.refreshTasks();

          // 初始同步筛选状态到 Alpine 响应式属性
          this._syncFilters();

          // 解析 URL 参数，自动打开创建弹窗
          this._handleUrlParams();

          // 启动智能轮询（替代固定5秒轮询）
          taskManager.startSmartPolling();
        },

        /**
         * 处理 URL 参数，支持从 Dashboard 快捷操作跳转
         * 支持参数: ?action=create&type=download|forward|listen_download|listen_forward
         */
        _handleUrlParams() {
          const params = new URLSearchParams(window.location.search);
          const action = params.get('action');
          const type = params.get('type');

          if (action === 'create') {
            // 设置任务类型
            if (type && ['download', 'forward', 'listen_download', 'listen_forward', 'cleanup_files'].includes(type)) {
              this.createForm.taskType = type;
              taskManager.createForm.taskType = type;
            }
            // 打开创建弹窗
            this.openCreateModal();
          }
        },

        // 手动刷新方法
        async manualRefresh() {
          await this.refreshTasks();
          this.addNotification('info', '任务列表已刷新');
        },

        // 同步分页状态到 Alpine 响应式属性
        _syncPagination() {
          this.totalPages = taskManager.totalPages;
          this.totalTasks = taskManager.totalTasks;
          this.currentPage = taskManager.page;
        },

        // 同步筛选状态到 Alpine 响应式属性
        _syncFilters() {
          this.currentFilter = taskManager.filter;
          this.currentTypeFilter = taskManager.typeFilter;
        },

        // 刷新任务并同步到 Alpine 响应式数据
        async refreshTasks() {
          this.loading = true;
          try {
            const params = {
              offset: (taskManager.page - 1) * taskManager.pageSize,
              limit: taskManager.pageSize
            };
            // 传递筛选状态
            if (taskManager.filter && taskManager.filter !== 'all') {
              params.status = taskManager.filter;
            }
            // 传递类型筛选参数
            if (taskManager.typeFilter && taskManager.typeFilter !== 'all') {
              params.task_type = taskManager.typeFilter;
            }
            const result = await api.getTasks(params);
            this.tasks = result.items || [];
            // 同步分页信息到 taskManager（供模板读取）
            taskManager.tasks = this.tasks;
            taskManager.totalTasks = result.total || 0;
            taskManager.totalPages = Math.ceil(taskManager.totalTasks / taskManager.pageSize) || 1;

            // 同步分页状态到 Alpine 响应式属性
            this._syncPagination();

            // 同步筛选状态到 Alpine 响应式属性
            this._syncFilters();

            // 更新最后同步时间
            this.lastSyncTime = this._formatSyncTime();

            // 触发智能轮询检查（根据任务状态决定是否启动/停止自动刷新）
            taskManager._checkAndAdjustPolling();
          } catch (error) {
            console.error('加载任务列表失败:', error);
          } finally {
            this.loading = false;
          }
        },

        // 格式化同步时间显示
        _formatSyncTime() {
          return new Date().toLocaleTimeString('zh-CN', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        },

        // 组件销毁时清理定时器
        destroy() {
          taskManager.stopSmartPolling();
        },

        openCreateModal() {
          this.showCreateModal = true;
          taskManager.showCreateModal = true;
          // 重置解析状态
          this.resolveLoading = false;
          this.resolveError = null;
          this.resolveResult = null;
          this.resolveTargetLoading = false;
          this.resolveTargetError = null;
          this.resolveTargetResult = null;
        },

        closeCreateModal() {
          this.showCreateModal = false;
          taskManager.closeCreateModal();
        },

        viewTaskDetail(task) {
          taskManager.viewTaskDetail(task);
          this.selectedTask = taskManager.selectedTask;
          this.showDetailDrawer = taskManager.showDetailDrawer;
        },

        closeDetailDrawer() {
          taskManager.closeDetailDrawer();
          this.showDetailDrawer = false;
          this.selectedTask = null;
        },

        // ==================== 解析功能 ====================

        async resolveSourceChat() {
          this.resolveLoading = true;
          this.resolveError = null;
          this.resolveResult = null;
          try {
            const result = await api.resolveChat(this.createForm.sourceChat);
            this.resolveResult = result;
            // 将源频道更新为解析后的数字 ID，确保后续提交使用正确的值
            this.createForm.sourceChat = Number(result.chat_id);
            // 自动同步 sourceChat 到 taskManager
            taskManager.createForm.sourceChat = this.createForm.sourceChat;
            console.log('[Resolve] 解析成功，sourceChat 已更新为:', this.createForm.sourceChat);
          } catch (error) {
            this.resolveError = this._mapResolveError(error.message);
          } finally {
            this.resolveLoading = false;
          }
        },

        async resolveTargetChat() {
          this.resolveTargetLoading = true;
          this.resolveTargetError = null;
          this.resolveTargetResult = null;
          try {
            const result = await api.resolveChat(this.createForm.targetChat);
            this.resolveTargetResult = result;
            // 直接更新 targetChat 为数字 ID，确保后续提交使用正确的值
            this.createForm.targetChat = Number(result.chat_id);
            taskManager.createForm.targetChat = this.createForm.targetChat;
            console.log('[Resolve] 解析成功，targetChat 已更新为:', this.createForm.targetChat);
          } catch (error) {
            this.resolveTargetError = this._mapResolveError(error.message);
          } finally {
            this.resolveTargetLoading = false;
          }
        },

        _mapResolveError(message) {
          const map = {
            '链接格式无效': '请检查输入格式，支持 @username 或 t.me 链接',
            '找不到频道': '未找到该对话，请检查输入是否正确',
            '无法访问该频道': '无法访问该对话，请确认已加入或权限足够',
            'FloodWaitError': '请求过于频繁，请稍后再试',
            '超时': '解析超时，请检查网络连接后重试',
            '网络连接失败': '网络连接失败，请检查后端服务是否运行',
          };
          return map[message] || message;
        },

        setFilter(filter) {
          taskManager.setFilter(filter);
          this._syncFilters();
          this.refreshTasks();
        },

        setTypeFilter(filter) {
          taskManager.setTypeFilter(filter);
          this._syncFilters();
          this.refreshTasks();
        },

        async prevPage() {
          if (this.currentPage <= 1) return;
          // 设置导航标志，阻止智能轮询的 loadTasks() 覆盖翻页请求的结果
          this._navigating = true;
          taskManager.page = this.currentPage - 1;
          await this.refreshTasks();
          this._navigating = false;
        },

        async nextPage() {
          if (this.currentPage >= this.totalPages) return;
          // 设置导航标志，阻止智能轮询的 loadTasks() 覆盖翻页请求的结果
          this._navigating = true;
          taskManager.page = this.currentPage + 1;
          await this.refreshTasks();
          this._navigating = false;
        },

        async deleteTask(taskId) {
          try {
            await taskManager.deleteTask(taskId);
          } catch (error) {
            this.addNotification('error', `删除失败: ${error.message}`);
            return;
          }
          // 同步 Alpine 响应式数据
          await this.refreshTasks();
        },

        async startTask(taskId) {
          try {
            await taskManager.startTask(taskId);
            this.addNotification('success', '任务已启动');
          } catch (error) {
            this.addNotification('error', `启动失败: ${error.message}`);
          }
          await this.refreshTasks();
        },

        async cancelTask(taskId) {
          try {
            await taskManager.cancelTask(taskId);
            this.addNotification('success', '任务已取消');
          } catch (error) {
            this.addNotification('error', `取消失败: ${error.message}`);
          }
          await this.refreshTasks();
        },

        async retryTask(taskId) {
          try {
            await taskManager.retryTask(taskId);
            this.addNotification('success', '任务已重试');
          } catch (error) {
            this.addNotification('error', `重试失败: ${error.message}`);
          }
          await this.refreshTasks();
        },

        async runTask(taskId) {
          try {
            await taskManager.runTask(taskId);
            this.addNotification('success', '已触发立即清理');
          } catch (error) {
            this.addNotification('error', `立即清理失败: ${error.message}`);
          }
          await this.refreshTasks();
        },

        async pauseTask(taskId) {
          try {
            await taskManager.pauseTask(taskId);
            this.addNotification('success', '已暂停定时清理');
          } catch (error) {
            this.addNotification('error', `暂停失败: ${error.message}`);
          }
          await this.refreshTasks();
        },

        async resumeTask(taskId) {
          try {
            await taskManager.resumeTask(taskId);
            this.addNotification('success', '已恢复定时清理');
          } catch (error) {
            this.addNotification('error', `恢复失败: ${error.message}`);
          }
          await this.refreshTasks();
        },

        async handleCreateTask() {
          this.createFormError = null;

          // 对于下载/转发/监听任务，确保 sourceChat 是数字 ID
          if (this.createForm.sourceChat) {
            if (typeof this.createForm.sourceChat !== 'number') {
              console.log('[Source] sourceChat 不是数字，自动解析:', this.createForm.sourceChat);
              try {
                this.resolveLoading = true;
                const result = await api.resolveChat(this.createForm.sourceChat);
                this.resolveResult = result;
                this.createForm.sourceChat = Number(result.chat_id);
                this.resolveLoading = false;
              } catch (error) {
                this.createFormError = `源频道解析失败：${error.message}`;
                return;
              }
            }
          }

          // 同步 Alpine createForm 到 taskManager（解析完成后再同步，确保拿到数字 ID）
          Object.assign(taskManager.createForm, this.createForm);

          // 验证表单
          const errors = taskManager.validateCreateForm();
          if (errors.length > 0) {
            this.createFormError = errors.join('；');
            return;
          }

          try {
            await taskManager.createTask();
            // 同步资源告警状态到 Alpine 响应式属性（驱动 x-show 更新）
            this._syncResourceAlert();
            // 若显示了资源告警弹窗，不继续创建流程（不关闭弹窗、不显示成功通知）
            if (taskManager.showResourceAlert) {
              return;
            }
            // 创建后立即刷新 Alpine 本地数据
            await this.refreshTasks();
            this.addNotification('success', '任务创建成功');
            this.closeCreateModal();
          } catch (error) {
            this.addNotification('error', `创建失败: ${error.message}`);
          }
        },

        /**
         * 资源告警弹窗中点击"确认创建"后的回调
         */
        async confirmCreateFromAlert() {
          this.closeResourceAlert();
          try {
            await taskManager.createTask();
            this._syncResourceAlert();
            await this.refreshTasks();
            this.addNotification('success', '任务创建成功');
            this.closeCreateModal();
          } catch (error) {
            this.addNotification('error', `创建失败: ${error.message}`);
          }
        },

        /**
         * 同步 taskManager 的资源告警状态到 Alpine 响应式属性
         */
        _syncResourceAlert() {
          this.showResourceAlert = taskManager.showResourceAlert;
          this.resourceAlertType = taskManager.resourceAlertType;
          this.resourceAlertMessage = taskManager.resourceAlertMessage;
          this.resourceSuggestion = taskManager.resourceSuggestion;
          this.resourceEstimate = taskManager.resourceEstimate;
        },

        /**
         * 关闭资源告警弹窗（同步 taskManager 状态到 Alpine 响应式属性）
         */
        closeResourceAlert() {
          taskManager.closeResourceAlert();
          this._syncResourceAlert();
        },

        logout() {
          authManager.logout();
        },

        addNotification(type, message) {
          this.notifications.push({ type, message });
          setTimeout(() => this.notifications.shift(), 5000);
        },

        /**
         * 解析多行 ID/链接输入的数量（基于 Alpine 响应式 createForm.rawItems）
         */
        getParsedItemCount() {
          if (!this.createForm.rawItems) return 0;
          return this.createForm.rawItems
            .split('\n')
            .map(line => line.trim())
            .filter(line => line.length > 0).length;
        },
      };
    }

    // 全局通知函数
    window.showNotification = function(type, message) {
      const app = document.querySelector('[x-data]');
      if (app && window.Alpine) {
        window.Alpine.$data(app).addNotification(type, message);
      }
    };

    // 在 Alpine 启动时，将 ConfirmDialog 包装为响应式对象
    document.addEventListener('alpine:init', () => {
      window.confirmDialog = Alpine.reactive(window.confirmDialog);
    });
  </script>

  <!-- Alpine.js (本地) - 必须在组件函数定义之后加载 -->
  <script src="vendor/alpinejs.js"></script>
</body>
</html>
